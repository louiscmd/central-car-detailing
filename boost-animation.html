<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Boost Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mp4-muxer@4/build/mp4-muxer.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#111; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    #wrap { transform-origin:top left; }
    #controls { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:100; }
    .btn { padding:13px 28px; border:none; border-radius:50px; font-size:15px; font-family:sans-serif; font-weight:600; cursor:pointer; transition:opacity .2s; }
    .btn:hover:not(:disabled) { opacity:.85; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    #replay-btn { background:#2a2a2a; color:#fff; }
    #export-btn { background:#34C759; color:#fff; min-width:170px; position:relative; overflow:hidden; }
    #ep { position:absolute; left:0; top:0; bottom:0; width:0%; background:rgba(255,255,255,.25); pointer-events:none; }
    #el { position:relative; z-index:1; }
  </style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="controls">
  <button class="btn" id="replay-btn">↺ Replay</button>
  <button class="btn" id="export-btn"><span id="ep"></span><span id="el">⬇ Download MP4</span></button>
</div>
<canvas id="ec" width="1080" height="1920" style="display:none;position:absolute;left:-9999px;"></canvas>

<script>
const W = 1080, H = 1920;

// ── Chart area ────────────────────────────────────────────────────────────────
const CL = 90, CR = W - 90;
const CT = 160, CB = 1800;
const CW = CR - CL, CH = CB - CT;

// ── Colours ───────────────────────────────────────────────────────────────────
const GREEN     = '#34C759';
const GREEN_RGB = '52,199,89';
const DARK      = '#1C1C1E';
const GREY      = '#8E8E93';

// ── Waypoints [normalised x, normalised y]  (y: 0=bottom, 1=top of chart) ────
// Realistic stock shape: volatile rise, then a hard boost at the end
const WPS = [
  [0.00, 0.03],
  [0.04, 0.07], [0.08, 0.04], [0.12, 0.09], [0.16, 0.06],
  [0.20, 0.15], [0.24, 0.11], [0.28, 0.19], [0.32, 0.15],
  [0.36, 0.23], [0.40, 0.19], [0.44, 0.28], [0.48, 0.24],
  [0.52, 0.33], [0.56, 0.29], [0.60, 0.38], [0.64, 0.34],
  [0.68, 0.43], [0.72, 0.39], [0.76, 0.49],
  // ── BOOST ──
  [0.80, 0.60], [0.84, 0.72], [0.87, 0.80],
  [0.90, 0.87], [0.93, 0.92], [0.96, 0.95], [1.00, 0.98],
];
const BOOST_START = 0.78; // normalised draw progress where boost begins

// ── Pre-compute dense point array (500 pts, linear interp between waypoints) ──
const NPTS = 600;
const PTS  = [];
for (let i = 0; i < NPTS; i++) {
  const t  = i / (NPTS - 1);
  let si   = WPS.length - 2;
  for (let j = 0; j < WPS.length - 1; j++) {
    if (WPS[j][0] <= t && WPS[j+1][0] > t) { si = j; break; }
  }
  const [x0,y0] = WPS[si], [x1,y1] = WPS[si+1];
  const st = (x1===x0) ? 1 : Math.min(1,(t-x0)/(x1-x0));
  PTS.push([CL + (x0+(x1-x0)*st)*CW, CB - (y0+(y1-y0)*st)*CH]);
}

// ── Timing ────────────────────────────────────────────────────────────────────
const ANIM_START = 0.4;
const ANIM_DUR   = 5.2;   // line fully drawn by this point
const TOTAL_DUR  = 7.5;
const MAX_PCT    = 847;

// Remap animation time → draw progress (slow rise, fast boost)
function tToDrawP(t) {
  const p = Math.max(0, Math.min(1, (t - ANIM_START) / ANIM_DUR));
  // pre-boost: p < 0.72 → drawP 0–0.76 (gradual)
  // boost: p 0.72–1.0 → drawP 0.76–1.0 (fast surge)
  return p < 0.72 ? (p / 0.72) * 0.76 : 0.76 + ((p - 0.72) / 0.28) * 0.24;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const clamp = x => Math.max(0, Math.min(1, x));
const lerp  = (a,b,t) => a + (b-a)*t;

// ── Render ────────────────────────────────────────────────────────────────────
function renderFrame(ctx, t) {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  const drawP  = tToDrawP(t);
  const count  = Math.max(2, Math.floor(NPTS * drawP));
  const isBoost = drawP >= BOOST_START;
  const boostP  = isBoost ? clamp((drawP - BOOST_START) / (1 - BOOST_START)) : 0;
  const fadeIn  = clamp(t / 0.5);

  // ── Subtle horizontal grid lines ────────────────────────────────────────────
  ctx.save();
  ctx.globalAlpha = fadeIn * 0.5;
  ctx.strokeStyle = '#E5E5EA';
  ctx.lineWidth   = 2;
  ctx.setLineDash([10, 10]);
  [0.25, 0.5, 0.75].forEach(h => {
    const gy = CB - h*CH;
    ctx.beginPath(); ctx.moveTo(CL, gy); ctx.lineTo(CR, gy); ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.restore();

  // ── Gradient fill below line ─────────────────────────────────────────────────
  const grad = ctx.createLinearGradient(0, CT, 0, CB);
  const fillOpacity = lerp(0.16, 0.28, boostP);
  grad.addColorStop(0, `rgba(${GREEN_RGB},${fillOpacity})`);
  grad.addColorStop(1, `rgba(${GREEN_RGB},0)`);

  ctx.beginPath();
  ctx.moveTo(PTS[0][0], CB);
  ctx.lineTo(PTS[0][0], PTS[0][1]);
  for (let i = 1; i < count; i++) ctx.lineTo(PTS[i][0], PTS[i][1]);
  ctx.lineTo(PTS[count-1][0], CB);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // ── Stock line ───────────────────────────────────────────────────────────────
  const lineW = lerp(7, 11, boostP);
  ctx.beginPath();
  ctx.moveTo(PTS[0][0], PTS[0][1]);
  for (let i = 1; i < count; i++) {
    const mx = (PTS[i-1][0] + PTS[i][0]) / 2;
    const my = (PTS[i-1][1] + PTS[i][1]) / 2;
    ctx.quadraticCurveTo(PTS[i-1][0], PTS[i-1][1], mx, my);
  }
  ctx.lineTo(PTS[count-1][0], PTS[count-1][1]);
  ctx.strokeStyle = GREEN;
  ctx.lineWidth   = lineW;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.stroke();

  // ── Glowing moving tip ───────────────────────────────────────────────────────
  const [tx, ty] = PTS[count-1];
  const tipR    = lerp(13, 18, boostP);
  const glowBlur = lerp(28, 55, boostP);
  ctx.save();
  ctx.shadowColor = GREEN;
  ctx.shadowBlur  = glowBlur;
  ctx.fillStyle   = GREEN;
  ctx.beginPath(); ctx.arc(tx, ty, tipR, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur  = 0;
  ctx.fillStyle   = '#fff';
  ctx.beginPath(); ctx.arc(tx, ty, tipR*0.42, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // ── Upward arrowhead at tip ────────────────────────────────────────────────
  if (drawP > 0.96) {
    const arrowAlpha = clamp((drawP - 0.96) / 0.04);
    ctx.save();
    ctx.globalAlpha = arrowAlpha;
    ctx.fillStyle   = GREEN;
    const aw=18, ah=28;
    ctx.beginPath();
    ctx.moveTo(tx,       ty - tipR - ah);
    ctx.lineTo(tx - aw,  ty - tipR);
    ctx.lineTo(tx + aw,  ty - tipR);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

}

// ── Viewport scaling ──────────────────────────────────────────────────────────
const wrap = document.getElementById('wrap');
function scale() {
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  wrap.style.transform = `translate(${(window.innerWidth-W*s)/2}px,${(window.innerHeight-H*s)/2}px) scale(${s})`;
}
scale(); window.addEventListener('resize', scale);

// ── Preview ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let startTs = null, rafId = null;
function runPreview() {
  if (rafId) cancelAnimationFrame(rafId); startTs = null;
  (function tick(ts) {
    if (!startTs) startTs = ts;
    const t = (ts - startTs) / 1000;
    renderFrame(ctx, Math.min(t, TOTAL_DUR));
    if (t < TOTAL_DUR) rafId = requestAnimationFrame(tick);
  })(performance.now());
}
runPreview();
document.getElementById('replay-btn').addEventListener('click', runPreview);

// ── MP4 export ────────────────────────────────────────────────────────────────
const exportBtn=document.getElementById('export-btn'),el=document.getElementById('el'),ep=document.getElementById('ep');
async function exportMP4() {
  if (!window.VideoEncoder) { alert('Requires Chrome 94+'); return; }
  exportBtn.disabled = true; await document.fonts.ready;
  const FPS=30, FRAMES=Math.ceil(FPS*TOTAL_DUR);
  const ec=document.getElementById('ec'), ectx=ec.getContext('2d');
  const codecs=['avc1.640034','avc1.640028','avc1.4d0034'];
  let codec=null;
  for (const c of codecs) { try { const r=await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate:8e6,framerate:FPS}); if(r.supported){codec=c;break;} } catch(_){} }
  if (!codec) { alert('H.264 not supported'); exportBtn.disabled=false; return; }
  const {Muxer,ArrayBufferTarget}=Mp4Muxer;
  const target=new ArrayBufferTarget();
  const muxer=new Muxer({target,video:{codec:'avc',width:W,height:H,frameRate:FPS},fastStart:'in-memory'});
  const encoder=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>console.error(e)});
  encoder.configure({codec,width:W,height:H,bitrate:8e6,framerate:FPS,latencyMode:'quality'});
  for (let i=0;i<FRAMES;i++) {
    renderFrame(ectx,i/FPS);
    const frame=new VideoFrame(ec,{timestamp:Math.round(i/FPS*1e6),duration:Math.round(1e6/FPS)});
    encoder.encode(frame,{keyFrame:i%(FPS*2)===0}); frame.close();
    if (i%10===0) { ep.style.width=Math.round(i/FRAMES*100)+'%'; el.textContent=`Encoding… ${Math.round(i/FRAMES*100)}%`; await new Promise(r=>setTimeout(r,0)); }
  }
  await encoder.flush(); muxer.finalize();
  const blob=new Blob([target.buffer],{type:'video/mp4'});
  const url=URL.createObjectURL(blob);
  Object.assign(document.createElement('a'),{href:url,download:'boost-animation.mp4'}).click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  ep.style.width='100%'; el.textContent='✓ Done!';
  setTimeout(()=>{ep.style.width='0%';el.textContent='⬇ Download MP4';exportBtn.disabled=false;},1800);
}
exportBtn.addEventListener('click', exportMP4);
</script>
</body>
</html>
